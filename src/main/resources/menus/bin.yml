# 公共垃圾箱菜单，修改后执行 /vc reload。
# %PAGE% 当前页，%MAX_PAGE% 总页数，%COUNT% 全箱物品件数。
# %EMPTY_SLOT% 当前页空物品格，%FILTER% 当前筛选，%MATCHES% 匹配记录数。
# %CLEAR_TIME% 自动清空剩余时间，%CLEAR_AT% 下次自动清空时刻；关闭时显示“未开启”。
# 颜色使用 & 代码；按钮默认直立字，自定义 &o 可开启斜体。

Title: '&b虚空清理 &7丨 &e公共垃圾箱 &7- &f%PAGE%&7/&f%MAX_PAGE%'
# 翻页到边界时追加的提示；Material 为兼容字段，当前不读取。
Disabled-Icon:
  Material: ''
  Lore: '&8（已到尽头）'
# 固定 6 行 × 9 格。空格为物品位，其他字符对应 Buttons。
Layout:
  - '         '
  - '         '
  - '         '
  - '         '
  - '         '
  - 'pf#si#r#n'
# display：外观。action：previous / next / first / last / category / search / reset / info / none。
# info 刷新当前页；none 仅装饰。材质使用 Bukkit 名称。
Buttons:
  'f':
    display:
      name: '&b分类：%FILTER%'
      material: HOPPER
      lore:
        - '&7点击切换分类；筛选页点击物品直接领取到背包'
        - '&7匹配记录：%MATCHES%'
    action: category
  's':
    display:
      name: '&b搜索物品'
      material: OAK_SIGN
      lore:
        - '&7点击获取搜索指令，可搜索材质ID或自定义名称'
    action: search
  'r':
    display:
      name: '&e返回全部 · 可存入'
      material: CHEST
      lore:
        - '&7清除分类与搜索，返回普通垃圾箱'
    action: reset
  '#':
    display:
      name: ' '
      material: BLACK_STAINED_GLASS_PANE
  'p':
    display:
      name: '&e&l← 上一页'
      material: ARROW
      lore:
        - '&7当前：&f第 %PAGE% 页 &7/ 共 &f%MAX_PAGE% &7页'
    action: previous
  'n':
    display:
      name: '&e&l下一页 →'
      material: ARROW
      lore:
        - '&7当前：&f第 %PAGE% 页 &7/ 共 &f%MAX_PAGE% &7页'
    action: next
  'i':
    display:
      name: '&6&l公共垃圾箱'
      material: CHEST
      glow: true
      lore:
        - '&7当前页码：&f%PAGE% &7/ &f%MAX_PAGE%'
        - '&7库存物品：&f%COUNT% &7件'
        - '&7剩余空位：&f%EMPTY_SLOT% &7格'
        - '&7自动清空剩余：&f%CLEAR_TIME%'
        - '&7下次自动清空：&f%CLEAR_AT%'
        - ''
        - '&8清理掉的掉落物都会收进这里'
        - '&8需要的话直接拿走就好啦~'
    action: info
