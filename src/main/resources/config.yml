# VoidClear 主配置
# 修改后执行 /vc reload；数据库设置修改后需要重启。
# 时间单位为秒，daily 时刻使用服务器时区；true 开启，false 关闭。
# 提示文字见 messages.yml，垃圾箱菜单见 menus/bin.yml。

# ── 1. 数据库 ──
# 多子服使用同一 MySQL 数据库和表前缀，插件版本保持一致。
# 切换数据库或表前缀不会自动搬运旧数据。
database:
  # sqlite：单服本地存储；mysql：多服共享。
  type: sqlite
  # SQLite 文件，相对于 plugins/VoidClear/。
  file: bin.db
  mysql:
    # 先创建数据库；远程连接请配置对应的 SSL/TLS 参数。
    jdbc-url: 'jdbc:mysql://127.0.0.1:3306/voidclear?useSSL=false&serverTimezone=UTC&characterEncoding=utf8'
    # 数据库账号与密码。
    username: ''
    password: ''
    # 只使用英文字母、数字和下划线。
    table-prefix: voidclear_
# 可用环境变量覆盖连接信息：VOIDCLEAR_DB_URL、VOIDCLEAR_DB_USER、VOIDCLEAR_DB_PASSWORD。

# ── 2. 地面清扫时间 ──
# 回收地面掉落物、清理命中规则的实体；不会清空垃圾箱。
timer:
  # interval：按间隔；daily：每天固定时刻。
  mode: interval
  # interval 模式的间隔，3600 秒 = 1 小时；重启接续倒计时。
  period: 3600
  # daily 模式使用，24 小时制 HH:mm。
  times:
    - '04:00'
    - '16:00'

# ── 3. 清扫性能 ──
sweep:
  # 每批区块数上限；关闭自适应后使用固定批量。
  batch: 600
  adaptive:
    # 根据本插件任务耗时调整后续批量。
    enable: true
    # 起始及最小批量，不超过 batch。
    min-batch: 16
    # 目标耗时，单位毫秒；是调节参考，不是每 tick 的硬限制。
    # 不含异步数据库等待，Folia 使用区域任务耗时之和。
    target-ms: 5
  slice:
    # 每片最多检查或处理的实体数，片间至少让出 1 tick。
    entities: 128
  # 区块内待清理目标少于此数则跳过；0 不限制。
  floor: 0
  # 提前多少秒发送聊天提醒；[] 关闭这些提醒。
  marks: [60, 30, 15, 5]

# ── 4. 清扫提醒 ──
sound:
  # 最后几秒每秒响一次；0 关闭。
  tail: 5
  # 额外响铃时刻；[] 不增加。
  marks: []
  # 倒计时与完成音效；空字符串关闭对应音效。
  key: 'block.note_block.pling'
  finish-key: 'block.note_block.bell'
  # 音量，0 静音。
  volume: 1.0
  # 音调，建议 0.5～2.0。
  pitch: 1.0

# 屏幕顶部的进度条。
bar:
  sweep:
    enable: true
    # PINK / BLUE / RED / GREEN / YELLOW / PURPLE / WHITE。
    color: BLUE
    # 剩余多少秒开始显示；0 全程显示。
    show-before: 60

# 快捷栏上方的清扫倒计时，与顶部进度条分别开关。
# 显示时间沿用 bar.sweep.show-before。
actionbar:
  sweep:
    enable: true

# ── 5. 实体规则 ──
# 保留优先，未命中清理名单也保留；玩家、Boss 和 /vc keep 标记始终保留。
# 名单支持 minecraft:zombie、minecraft:*、animals、monster、'*'。
# monster 为敌对实体分类（排除动物）；单独的 '*' 必须加引号。
rule:
  # 命名生物始终保留；false 则继续按名单判断。
  named-kept: false
  # 精确 ID、命名空间和分类只匹配原版实体；名单中的 '*' 不受此项限制。
  vanilla-only: true
  # 通用、动物、怪物白名单：命中即保留。
  whitelist: []
  animal-whitelist: []
  monster-whitelist: []
  # 分类保留名单，优先于清理名单。
  animal-keep: [animals]
  monster-keep: []
  # 分类清理名单，仍受世界开关和保留规则约束。
  animal-sweep: []
  monster-sweep: [monster]
  # 全局保留与清理名单。
  keep:
    - animals
  sweep:
    - monster
  # 世界名使用世界文件夹名称；未设置的项沿用全局。
  # 世界 keep / sweep 分别覆盖全局名单，白名单和分类保留规则仍生效。
  # 示例：world: {world_nether: {monsters: false}}
  world: {}

# ── 6. 垃圾箱自动清空 ──
# 默认关闭。开启后会永久删除箱内物品，与地面清扫分别计时。
trash:
  clear:
    enable: false
    # interval：按间隔；daily：每天固定时刻。
    mode: interval
    # interval 模式的间隔；7200 秒 = 2 小时。
    # 重启接续倒计时，关机时已到期则在开服后清空。
    period: 7200
    # daily 模式使用，关机错过的时刻不补清。
    times:
      - '04:00'
      - '16:00'
    # 提前多少秒发送清空提醒；[] 关闭提醒。
    marks: [30, 10, 5]

# ── 7. 掉落物回收与保护 ──
# 仅影响地面清扫，玩家仍可主动将受保护物品存入垃圾箱。
drop:
  enable: true
  # 新掉落物保护时间；0 关闭。按已加载 tick 计时，重启可能重新保护。
  protect-seconds: 60
  # rule.world.<世界名>.drop.protection 可整体覆盖此小节。
  protection:
    # 附魔装备与附魔书保护。
    enchanted: false
    # 非空潜影盒等方块容器、收纳袋保护。
    nonempty-containers: true
    # ItemMeta 自定义标记，如 ['myitems:weapon', 'quest:*']。
    pdc-keys: []
  # 自定义豁免：同条规则的 id/name/lore 全部命中才保留，多条规则满足一条即可。
  # id 为完整物品 ID；name/lore 以 * 开头表示包含匹配，否则完全匹配。
  # 例：保留名称含“重要”的物品，取消下面两行注释即可。
  # important:
  #   name: '*重要'

# ── 8. 世界默认开关 ──
# 生物仍需命中清理名单；单世界可在 rule.world 下覆盖。
world:
  # 生物与经验球总开关。
  creatures: true
  # 动物清扫。
  animals: true
  # 怪物清扫。
  monsters: true
  # 经验球会直接移除，不存入垃圾箱。
  experience-orbs: true
  # 掉落物回收还需 drop.enable 开启。
  drops: true

# ── 9. 防踩踏与爆炸保护 ──
# true 表示保护农田和海龟蛋。
trample:
  # 玩家踩踏保护。
  players: true
  # 生物踩踏保护。
  mobs: true
  # 空列表表示所有世界。
  worlds: []

# 列出的爆炸实体不破坏方块，伤害仍保留；[] 关闭。
blast:
  blocked:
    - minecraft:creeper
