# =====================================================================
# 虚空清理提示文案
# 配色：&f 白（重点）、&7 灰（正文）、&8 深灰（分隔），&b 淡蓝只做标题重点
# &c 只用于错误。%XXX% 是占位符，删掉会导致那条消息显示不全。
# 此文件只改提示文字，不控制清扫开关、周期或提醒时刻；那些设置在 config.yml。
# 修改后执行 /vc reload；保留配置键名和缩进。含 &、# 等符号的文字建议保持引号。
# 常用颜色：&f 白色、&7 灰色、&8 深灰、&b 淡蓝、&c 红色、&e 黄色；&l 加粗。
# =====================================================================

# 多数聊天提示前附加的插件名称；设为 '' 不显示前缀，不影响 Boss 条和菜单标题。
prefix: '&8[&b虚空清理&8] &7'

general:
  # 没有指令所需权限时显示。
  no-permission: '&c没有权限使用该指令'
  # /vc reload 成功后显示；配置有错误时不会显示成功提示。
  reloaded: '&f配置已重载'
  # 控制台执行仅限玩家的指令（如打开垃圾箱）时显示。
  players-only: '&c该指令只能在游戏内执行'

sweep:
  # 保留的清扫标题文案；当前倒计时聊天实际使用下面的 countdown.tick。
  countdown: '&7清扫倒计时'
  # 普通清扫前的聊天提醒；%TIME% 是剩余秒数，提醒时刻由 config.yml 的 sweep.marks 决定。
  countdown.tick: '&f%TIME% &7秒后清扫'
  # 自动倒计时结束、实际开始普通清扫时显示。
  countdown.start: '&f清扫开始'
  # 管理员执行 /vc sweep、实际开始清扫时显示。
  triggered: '&f清扫开始'
  # 上一轮还在清扫，不能再次启动时显示。
  busy: '&7上一轮清扫尚未结束，请稍等'
  # %COUNT% 已处理目标数（含部分回收的掉落物），%ITEMS% 确认入箱的实际物品件数；%COLLECTED% 保留为旧版掉落实体计数，%SECONDS% 耗时秒。
  # 并非“全部移除数”；仅检查已加载区块，受到规则、保护和垃圾箱容量限制。
  done: '&7本轮清扫结束 &8· &7已处理 &f%COUNT% &7个目标，确认回收 &f%ITEMS% &7件物品 &8· &7%SECONDS%秒'
  empty: '&7本轮未处理目标 &8· &7已加载区块内，无符合规则且可处理的目标 &8· &7%SECONDS%秒'
  # %FAILED% 为失败/拒收任务数；即使有部分回收，也不能称整轮成功。
  incomplete: '&e本轮清扫未完整执行 &8· &7已处理 &f%COUNT% &7个目标，确认回收 &f%ITEMS% &7件物品 &8· &7失败任务 &f%FAILED% &8· &7%SECONDS%秒；请查看服务端日志'
  # 仅本轮确认有入箱物品时追加；公共回收箱物品可能已被他人领取。
  claim: ' &8· &7本轮已入箱物品可用 &f/vc trash &7查看'

trash:
  waiting: '&7正在确认上一笔操作，请稍候…'
  # 垃圾箱清空前的聊天提醒；%TIME% 为剩余秒数，时刻由 config.yml 的 trash.clear.marks 决定。
  countdown.tick: '&7垃圾箱将在 &f%TIME% &7秒后清空，请及时领取'
  # 自动清空垃圾箱后的广播；这里只改文字，不会开启或关闭清空功能。
  # %COUNT% 为实际物品件数，64 + 16 计为 80 件，不是 2 组。
  cleared: '&7垃圾箱已清空，删除 &f%COUNT% &7件物品'

check:
  # /vc check 缺少参数时的用法提示；尖括号里的参数必填，方括号里的参数选填。
  usage: '&7用法 &f/vc check <实体> [世界]'
  # 查不到该实体类型时显示；%ID% 是输入的实体名称或 ID。
  unknown: '&c没有这个实体 &8· &f%ID%'
  # 查询结果：%ID% 实体、%RESULT% 保留/扫掉、%REASON% 判定依据。
  result: '&f%ID% &8· %RESULT% &8· &7%REASON%'
  # 查询判定为“将被清扫”时，填入上面 %RESULT% 的文字。
  removed: '&7清扫'
  # 查询判定为“将被保留”时，填入上面 %RESULT% 的文字。
  kept: '&f保留'

keep:
  # /vc keep 成功后显示；%COUNT% 是标记为不清扫的实体数量。
  marked: '&f%COUNT% &7个实体已标记为不清扫'
  # /vc unkeep 成功后显示；%COUNT% 是取消保护标记的实体数量。
  unmarked: '&f%COUNT% &7个实体已取消标记'

status:
  # /vc status 状态列表的标题。
  header: '&b虚空清理 &8· &7状态'
  # 下次普通清扫一行；%VALUE% 为剩余时间，也可加 %NAME% 显示内置项目名。
  sweep: '&7下次清扫 &f%VALUE%'
  # 尚未完成过一轮清扫；有结果时与手动/自动清扫采用同一条准确提示。
  no-result: '&7本次启动尚无清扫结果'

history:
  # /vc history 参数错误时显示；[条数] 等方括号内容为选填，type / player 为筛选方式。
  usage: '&7用法 &f/vc history [条数] [type <操作>|player <玩家>]'
  # 历史记录列表标题；%COUNT% 为本次展示的记录条数，不是物品数量。
  header: '&b最近操作 &8· &f%COUNT% 条'
  # 尚无记录，或筛选结果为空时显示。
  empty: '&7暂无记录'
  # 读取历史记录失败时显示，详细原因请查看服务端日志。
  failed: '&c读取操作记录失败'

audit:
  usage: '&7用法 &f/vc audit [1-20] [type <DEPOSIT|WITHDRAW>|player <名字或UUID>]'
  header: '&b本服存取审计 &8· &f%COUNT% 条'
  empty: '&7保留范围内无匹配记录；不能据此证明没有存取'
  failed: '&c读取存取审计失败，请检查服务端日志'

diagnose:
  usage: '&7用法 &f/vc diagnose [export]'
  started: '&7正在后台读取诊断；不会修改数据库、解除隔离或补发物品'
  exported: '&7诊断已导出 &8· &f%FILE%'
  failed: '&c诊断任务或导出失败，请检查服务端日志'

receipt:
  console-only: '&c收据清理仅限服务器控制台；游戏内和命令方块不能执行。'
  usage: '&7用法：/vc receipt <玩家UUID> [confirm <预览确认码>]'

help:
  # /vc help [1-3]：管理员按页分组；普通玩家仅看到公共回收。
  # 悬停展示完整用法，点击只填入命令；只有翻页会直接执行。
  header: ' &b&l虚空清理 &8/ &f使用指南'
  sections:
    '1': '日常管理'
    '2': '记录与诊断'
    '3': '维护与安全'
  public: '公共回收'
  footer: ' &8悬停看用法 · 点击填入'
  descriptions:
    trash: '打开公共回收箱'
    sweep: '立即开始一轮清扫'
    status: '查看倒计时与上轮结果'
    check: '查看实体清扫规则'
    keep: '保护指定实体'
    unkeep: '取消实体保护'
    audit: '查询本服物品存取'
    history: '检索管理操作记录'
    trend: '查看每日清扫趋势'
    export: '导出清扫统计 CSV'
    diagnose: '只读诊断与报告导出'
    reload: '重载配置与提示文案'
    trash-clear: '永久清空回收箱 · 需确认'
    receipt: '清理失效收据 · 仅控制台'
  # 兼容旧版自定义 help.lines（含 []）；显式设置后，管理员仍使用自定义列表。

# 屏幕顶部 Boss 条的标题，%TIME% 为普通清扫剩余秒数。
# 是否显示与提前显示时间，在 config.yml 的 bar.sweep 中设置。
bar:
  sweep:
    title: '&b清扫倒计时 &8· &f%TIME% &7秒'

# 快捷栏上方 ActionBar 的标题，%TIME% 为普通清扫剩余秒数。
# 开关在 config.yml 的 actionbar.sweep.enable；不会显示垃圾箱清空倒计时。
actionbar:
  sweep:
    title: '&b清扫倒计时 &8· &f%TIME% &7秒'

# 只读清扫预览，不修改实体或库存。
preview:
  started: '&7正在预览已加载区块，不会移除实体或写入库存…'
  summary: '&b清扫预览 &7（当前估计，正式执行时重新判定）'
