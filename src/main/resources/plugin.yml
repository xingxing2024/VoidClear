# 插件注册与权限声明，日常设置请修改 config.yml。
# version 在构建时替换；libraries 由服务端在首次启动时下载。
name: VoidClear
version: '${project.version}'
main: net.voidclear.VoidClearPlugin
api-version: '1.21'
folia-supported: true
softdepend: [PlaceholderAPI]
libraries:
  - org.xerial:sqlite-jdbc:3.51.0.0
  - com.mysql:mysql-connector-j:9.6.0
description: VoidClear 虚空清理，定时清扫实体，掉落物进入公共垃圾箱。
authors: [VoidClear]
commands:
  voidclear:
    description: 虚空清理主指令
    usage: /vc <admin|sweep|preview|trash|check|keep|unkeep|status|diagnose|audit|history|trend|export|receipt|reload|help>
    aliases: [vc]
permissions:
  voidclear.admin:
    description: 管理清扫、重载、诊断与存取审计
    default: op

  voidclear.trash.open:
    description: 打开公共垃圾箱
    default: true
  voidclear.trash.deposit:
    description: 向公共垃圾箱存入物品
    default: true
  voidclear.trash.withdraw:
    description: 从公共垃圾箱领取物品
    default: true
  voidclear.trash.search:
    description: 使用分类与搜索（还需open权限）
    default: true
